<!doctype html>
<html lang="en" data-diff-color-scheme="red-green" data-chat-width="comfortable">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>lalala</title>
    <script>
      // What T3's useTheme puts on <html> for its dark theme; the canvas is always dark.
      (() => {
        const root = document.documentElement;
        root.style.cssText =
          "--appearance-contrast-base: 100%; --appearance-contrast-boost: 0%; --appearance-contrast-border-boost: 0%; --glass-opacity: 80%; font-size: 16px; --font-size-prompt: var(--text-sm); --font-size-code: 13px; --diffs-font-size: 13px; -webkit-font-smoothing: antialiased; overscroll-behavior: none;";
        const apply = () => {
          root.classList.add("dark");
          root.style.colorScheme = "dark";
          const background = getComputedStyle(root).getPropertyValue("--background").trim();
          if (background) root.style.backgroundColor = background;
          if (document.body) {
            document.body.style.backgroundColor = root.style.backgroundColor;
            document.body.style.overscrollBehavior = "none";
          }
        };
        apply();
        window.addEventListener("DOMContentLoaded", apply);
        window.addEventListener("load", apply);
      })();
    </script>
    <style>
      /* Boot screen: in the HTML so the phone never shows a bare black page; React replaces #root's
         contents on mount, which removes it. The lalala mark as small white ASCII, turning in 3D. */
      #lala-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 10px;
        background: #000;
        color: #fff;
        font: 700 7px / 1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #lala-boot pre { margin: 0; font: inherit; white-space: pre; }
      #lala-boot .msg { display: grid; place-items: center; min-height: 28px; }
      #lala-boot .msg > * { grid-area: 1 / 1; }
      #lala-boot .slow,
      #lala-boot button {
        font: 700 9px / 1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.08em;
        color: #fff;
      }
      #lala-boot .slow { visibility: hidden; opacity: 0.6; animation: lala-boot-show 0s 15s forwards; }
      #lala-boot button {
        display: none;
        padding: 10px 12px;
        border: 0;
        background: none;
        cursor: pointer;
      }
      #lala-boot button:focus-visible { outline: 1px solid #fff; outline-offset: 0; }
      #lala-boot.is-failed .slow { display: none; }
      #lala-boot.is-failed button { display: block; }
      @keyframes lala-boot-show { to { visibility: visible; } }
    </style>
    <script>
      // A module that fails to load or throws before the app mounts leaves the boot screen up; say so.
      (() => {
        const fail = (event) => {
          const boot = document.getElementById("lala-boot");
          if (!boot) return;
          const fromScript = event.target instanceof HTMLScriptElement;
          if (!fromScript && !(event instanceof ErrorEvent)) return;
          boot.classList.add("is-failed");
          const button = boot.querySelector("button");
          if (button && !button.title)
            button.title = fromScript
              ? "Part of the app didn't arrive. The connection may have dropped, or the computer is mid-update."
              : `It stopped with an error: ${event.message}`;
        };
        window.addEventListener("error", fail, true);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="lala-boot" role="status" aria-live="polite" aria-label="Loading">
        <pre aria-hidden="true"></pre>
        <div class="msg">
          <span class="slow">slow connection</span>
          <button type="button" onclick="location.reload()">tap to retry</button>
        </div>
      </div>
    </div>
    <script type="module">
      // The mark's drawing and frame loop are the canvas's PageLoader's (one source); it turns until
      // React removes the boot screen, glitching once the load fails. A module, so it starts just
      // before the app's.
      import { runLogo } from "/src/voice/extras/asciiLogo.ts";
      const boot = document.getElementById("lala-boot");
      const pre = boot?.querySelector("pre");
      if (pre)
        runLogo(
          pre,
          () => !boot.isConnected,
          () => boot.classList.contains("is-failed"),
        );
    </script>
          <span class="tag slow">Slow connection</span>
          <button type="button" onclick="location.reload()"><span class="tag">Didn't load<small>Tap to reload</small></span></button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
