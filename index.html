<!doctype html>
<html lang="en" data-diff-color-scheme="red-green" data-chat-width="comfortable">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>lalala</title>
    <script>
      // What T3's useTheme puts on <html> for its dark theme; the canvas is always dark.
      (() => {
        const root = document.documentElement;
        root.style.cssText =
          "--appearance-contrast-base: 100%; --appearance-contrast-boost: 0%; --appearance-contrast-border-boost: 0%; --glass-opacity: 80%; font-size: 16px; --font-size-prompt: var(--text-sm); --font-size-code: 13px; --diffs-font-size: 13px; -webkit-font-smoothing: antialiased; overscroll-behavior: none;";
        const apply = () => {
          root.classList.add("dark");
          root.style.colorScheme = "dark";
          const background = getComputedStyle(root).getPropertyValue("--background").trim();
          if (background) root.style.backgroundColor = background;
          if (document.body) {
            document.body.style.backgroundColor = root.style.backgroundColor;
            document.body.style.overscrollBehavior = "none";
          }
        };
        apply();
        window.addEventListener("DOMContentLoaded", apply);
        window.addEventListener("load", apply);
      })();
    </script>
    <style>
      /* Boot screen: in the HTML so the phone never shows a bare black page; React replaces #root's
         contents on mount, which removes it. The device bar's connecting look without the bar: its plate,
         the ASCII line's two glyph rows and a cyan light sweeping through (transform only). */
      #lala-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #0b0608;
      }
      #lala-boot .plate {
        position: relative;
        display: grid;
        place-items: center;
        width: min(360px, calc(100vw - 48px));
        height: 46px;
        background:
          repeating-linear-gradient(to bottom, rgba(255, 94, 84, 0.04) 0 1px, transparent 1px 3px),
          #190d12;
        clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
      }
      /* The edge as its own ring (cutFrame.css): a border would be sliced off along the cuts. */
      #lala-boot .plate::after {
        content: "";
        position: absolute;
        inset: 0;
        background: #af423d;
        pointer-events: none;
        clip-path: polygon(evenodd, 10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px, 10px 0, 10.41px 1px, calc(100% - 10.41px) 1px, calc(100% - 1px) 10.41px, calc(100% - 1px) calc(100% - 10.41px), calc(100% - 10.41px) calc(100% - 1px), 10.41px calc(100% - 1px), 1px calc(100% - 10.41px), 1px 10.41px, 10.41px 1px);
      }
      #lala-boot .plate > * { grid-area: 1 / 1; }
      #lala-boot .rows {
        position: relative;
        width: calc(100% - 24px);
        overflow: hidden;
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
        mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
      }
      #lala-boot pre {
        margin: 0;
        color: #ffd8d2;
        font: 700 9px / 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 3.6px;
        text-align: center;
        white-space: pre;
      }
      #lala-boot pre b { display: block; font-weight: inherit; opacity: 0.62; }
      #lala-boot pre b + b { opacity: 0.42; }
      #lala-boot .sweep {
        position: absolute;
        inset: 0 auto 0 0;
        width: 26%;
        overflow: hidden;
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 40%, #000 60%, transparent);
        mask-image: linear-gradient(90deg, transparent, #000 40%, #000 60%, transparent);
        animation: lala-boot-sweep 2.2s linear infinite;
      }
      /* The lit copy moves back as far as its window moves on, so its glyphs stay over the rows'. */
      #lala-boot .sweep pre {
        position: absolute;
        inset: 0 auto 0 0;
        width: 384.62%;
        color: #26f3ec;
        text-shadow: 0 0 6px rgba(38, 243, 236, 0.55);
        animation: lala-boot-unsweep 2.2s linear infinite;
      }
      #lala-boot .sweep pre b { opacity: 1; }
      #lala-boot .sweep pre b + b { opacity: 0.8; }
      #lala-boot .tag {
        display: inline-grid;
        gap: 3px;
        padding: 4px 9px 4px 8px;
        background: #ffd8d2;
        color: #190d12;
        font: 600 9.5px / 1 "Oxanium", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        white-space: nowrap;
        clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);
      }
      #lala-boot .slow { visibility: hidden; animation: lala-boot-show 0s 15s forwards; }
      #lala-boot button {
        display: none;
        padding: 6px;
        border: 0;
        background: none;
        cursor: pointer;
      }
      #lala-boot button .tag { background: #ff5e54; padding: 5px 10px 5px 9px; font-size: 10.5px; }
      #lala-boot button small { font-size: 8.5px; opacity: 0.78; }
      #lala-boot button:focus-visible { outline: 1px solid #26f3ec; outline-offset: 0; }
      #lala-boot.is-failed .sweep, #lala-boot.is-failed .slow { display: none; }
      #lala-boot.is-failed .rows { opacity: 0.4; }
      #lala-boot.is-failed button { display: block; }
      @keyframes lala-boot-sweep {
        from { transform: translateX(-100%); }
        80%, to { transform: translateX(384.62%); }
      }
      @keyframes lala-boot-unsweep {
        from { transform: translateX(26%); }
        80%, to { transform: translateX(-100%); }
      }
      @keyframes lala-boot-show { to { visibility: visible; } }
      @media (prefers-reduced-motion: reduce) {
        #lala-boot .sweep { display: none; }
      }
    </style>
    <script>
      // A module that fails to load or throws before the app mounts leaves the boot screen up; say so.
      (() => {
        const fail = (event) => {
          const boot = document.getElementById("lala-boot");
          if (!boot) return;
          const fromScript = event.target instanceof HTMLScriptElement;
          if (!fromScript && !(event instanceof ErrorEvent)) return;
          boot.classList.add("is-failed");
          const button = boot.querySelector("button");
          if (button && !button.title)
            button.title = fromScript
              ? "Part of the app didn't arrive. The connection may have dropped, or the computer is mid-update."
              : `It stopped with an error: ${event.message}`;
        };
        window.addEventListener("error", fail, true);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="lala-boot" role="status" aria-live="polite" aria-label="Loading">
        <div class="plate">
          <div class="rows" aria-hidden="true">
            <pre><b>+o8##8###@##8#9###8##@#8###9##8#@##8###9#8##o+</b><b>+o98898&amp;89o988*98&amp;9898899&amp;9889o98898&amp;989o89o+</b></pre>
            <div class="sweep"><pre><b>+o8##8###@##8#9###8##@#8###9##8#@##8###9#8##o+</b><b>+o98898&amp;89o988*98&amp;9898899&amp;9889o98898&amp;989o89o+</b></pre></div>
          </div>
          <span class="tag slow">Slow connection</span>
          <button type="button" onclick="location.reload()"><span class="tag">Didn't load<small>Tap to reload</small></span></button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
